name: source-validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Validate Canonical source and reference fixtures
        run: python scripts/validate_package.py

      - name: Validate deterministic generation
        run: python scripts/validate_reproducibility.py --days 5 --scope full

      - name: Validate evaluation-truth isolation
        run: python -m unittest tests/test_dataset_api_truth_isolation.py

      - name: Generator and daemon import smoke
        run: |
          python - <<'PY'
          import config
          import daemon
          import line_worker
          import physics_engine
          import protocol
          import run
          import state_tracker

          assert "build_topology" in physics_engine.__all__
          assert "coupled_cnc_values" in physics_engine.__all__
          print("canonical_and_daemon_import_smoke=ok")
          PY

      - name: Python compile smoke
        run: python -m compileall -q agent api model protocol scripts *.py

      - name: Verify generated validation baselines are current
        run: git diff --exit-code -- canonical/validation

      - name: Diff whitespace check
        run: git diff --check
